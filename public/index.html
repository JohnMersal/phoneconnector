 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CRM Dialer - Agent Portal</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh; margin: 0; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; transition: background-color 0.2s; overflow: hidden; }
        
        #auto-mode-container { position: absolute; top: 15px; right: 15px; z-index: 50; display: flex; flex-direction: column; gap: 5px; font-size: 11px; font-weight: bold; color: #888; background: #111; padding: 10px; border-radius: 10px; border: 1px solid #333; }
        .info { font-size: 14px; color: #666; text-transform: uppercase; letter-spacing: 2px; text-align: center; margin-top: 60px; }
        .button-container { width: 85%; display: flex; flex-direction: column; gap: 12px; align-items: center; }
        
        #pull-btn { width: 100%; height: 10vh; background: #3498db; color: white; border: none; border-radius: 20px; font-size: 20px; font-weight: 800; cursor: pointer; appearance: none; }
        
        .action-link { width: 100%; display: none; align-items: center; justify-content: center; text-decoration: none; border-radius: 20px; font-weight: 700; font-size: 18px; color: white; }
        #dial-btn { height: 35vh; font-size: 38px; border-radius: 30px; background: #2ecc71; border: 4px solid rgba(255,255,255,0.1); }
        #zoom-btn { height: 8vh; background: #2D8CFF; }
        #copy-btn { height: 8vh; background: #333; border: 1px solid #444; }
        
        .footer { color: #444; font-size: 12px; text-align: center; margin-bottom: 10px; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 100; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; color: #2ecc71; text-align: center; cursor: pointer; }
    </style>
</head>
<body>
    <div id="overlay">TAP TO START <br> AGENT SESSION</div>
    <div id="auto-mode-container">
        <div style="margin-bottom: 5px; color: #fff;">AUTO MODE:</div>
        <label><input type="radio" name="autoMode" value="none" checked> None</label>
        <label><input type="radio" name="autoMode" value="zoom"> Auto Zoom</label>
        <label><input type="radio" name="autoMode" value="phone"> Auto Phone</label>
    </div>
    <div class="info" id="agent-label">Agent: Loading...</div>
    <div class="button-container">
        <button id="pull-btn">📥 PULL NEW LEAD</button>
        <a id="dial-btn" class="action-link" href="javascript:void(0)" style="display: flex;">No Lead</a>
        <a id="zoom-btn" class="action-link" href="javascript:void(0)">📞 Zoom Call</a>
        <a id="copy-btn" class="action-link" href="javascript:void(0)">📋 Copy Number</a>
    </div>
    <div class="footer" id="last-sync">Ready to pull.</div>

    <script>
        const dialBtn = document.getElementById('dial-btn'), 
              zoomBtn = document.getElementById('zoom-btn'), 
              copyBtn = document.getElementById('copy-btn'), 
              pullBtn = document.getElementById('pull-btn'), 
              overlay = document.getElementById('overlay'), 
              agentLabel = document.getElementById('agent-label');
        
        let currentNum = "", formattedIntl = "", vibrationUnlocked = false;

        const savedMode = localStorage.getItem('autoMode') || 'none';
        document.querySelector(`input[value="${savedMode}"]`).checked = true;
        document.querySelectorAll('input[name="autoMode"]').forEach(r => r.addEventListener('change', (e) => localStorage.setItem('autoMode', e.target.value)));

        const userId = window.location.pathname.split('/').filter(p => p)[0] || prompt("Enter Agent Name:");
        agentLabel.innerText = "Agent: " + userId;

overlay.addEventListener('pointerdown', (e) => {
    // This event fires for both mouse clicks and touch taps
    e.preventDefault(); 
    vibrationUnlocked = true;
    overlay.style.display = 'none';
}, { once: true, passive: false });
        
        function triggerZoom(e) { 
            if(e) e.preventDefault();
            if (formattedIntl) {
                const zoomFormat = formattedIntl.startsWith('00') ? '+' + formattedIntl.substring(2) : '+' + formattedIntl;
                window.location.href = "zoomphonecall://" + zoomFormat; 
            }
        }
        
        async function copyToClipboard(e) {
            e.preventDefault();
            try {
                await navigator.clipboard.writeText(formattedIntl);
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "✅ Copied!";
                setTimeout(() => copyBtn.innerText = originalText, 2000);
            } catch (err) { alert("Failed to copy"); }
        }

        async function fetchLead() {
            pullBtn.disabled = true;
            try {
                const response = await fetch(`/get-number/${userId}`);
                const data = await response.json();
                if (data.phone && data.phone !== "No number yet" && data.phone !== currentNum) {
                    currentNum = data.phone;
                    
                    // Unified Formatting Logic
                    formattedIntl = data.phone.startsWith('00') ? data.phone : '002' + data.phone.replace(/\D/g, '');

                    dialBtn.innerText = data.phone; 
                    dialBtn.href = "tel:" + formattedIntl;
                    copyBtn.innerText = `📋 Copy Number (${formattedIntl})`;
                    
                    zoomBtn.style.display = 'flex'; 
                    copyBtn.style.display = 'flex';
                    
                    if (localStorage.getItem('autoMode') === 'zoom') triggerZoom();
                    else if (localStorage.getItem('autoMode') === 'phone') window.location.href = "tel:" + formattedIntl;
                }
            } catch (e) { pullBtn.innerText = "Error! ⚠️"; } finally { pullBtn.disabled = false; }
        }
        
        zoomBtn.onclick = triggerZoom;
        copyBtn.onclick = copyToClipboard;
        pullBtn.onclick = fetchLead;
    </script>
</body>
</html>
