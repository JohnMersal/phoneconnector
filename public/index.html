<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CRM Dialer - Agent Portal</title>
    <style>
        /* Modern Styles */
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --primary: #2563eb; --accent: #10b981; --text: #f8fafc; }
        
        * { box-sizing: border-box; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg-dark); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        #overlay { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; text-align: center; font-size: 1.5rem; }

        .app-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 20px; }

        /* Header */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .agent-badge { background: #334155; padding: 6px 12px; border-radius: 20px; font-size: 12px; }
        
        select { background: #334155; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }

        /* Card */
        .main-card { background: var(--card-bg); padding: 24px; border-radius: 24px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }

        #pull-btn { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }

        .lead-box { background: linear-gradient(135deg, #059669, #047857); padding: 24px; border-radius: 16px; text-align: center; margin-bottom: 20px; }
        #dial-btn { font-size: 28px; font-weight: bold; text-decoration: none; color: white; display: block; }

        .action-btns { display: flex; flex-direction: column; gap: 12px; }
        .action-link { padding: 14px; border-radius: 12px; text-align: center; text-decoration: none; font-weight: 600; color: white; display: none; }
        #zoom-btn { background: var(--primary); }
        #copy-btn { background: #475569; }

        .footer { color: #64748b; font-size: 12px; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="overlay">TAP TO START AGENT SESSION</div>

    <div class="app-container">
        <div class="top-bar">
            <div class="agent-badge" id="agent-label">Agent: Loading...</div>
            <select id="auto-mode-select">
                <option value="none">Auto: None</option>
                <option value="zoom">Auto: Zoom</option>
                <option value="phone">Auto: Phone</option>
            </select>
        </div>

        <div class="main-card">
            <button id="pull-btn">🔄 Pull New Lead</button>
            <div class="lead-box">
                <div style="font-size: 12px; opacity: 0.8; margin-bottom: 5px;">CURRENT LEAD</div>
                <a id="dial-btn" href="javascript:void(0)">No Lead</a>
            </div>
            <div class="action-btns">
                <a id="zoom-btn" class="action-link" href="javascript:void(0)">🎥 Zoom Call</a>
                <a id="copy-btn" class="action-link" href="javascript:void(0)">📋 Copy Number</a>
            </div>
        </div>
        <div class="footer" id="last-sync">Ready to pull.</div>
    </div>

    <script>
        const dialBtn = document.getElementById('dial-btn'), 
              zoomBtn = document.getElementById('zoom-btn'), 
              copyBtn = document.getElementById('copy-btn'), 
              pullBtn = document.getElementById('pull-btn'), 
              overlay = document.getElementById('overlay'), 
              agentLabel = document.getElementById('agent-label'),
              modeSelect = document.getElementById('auto-mode-select');
        
        let currentNum = "", formattedIntl = "";

        // Mode Handling
        modeSelect.value = localStorage.getItem('autoMode') || 'none';
        modeSelect.addEventListener('change', (e) => localStorage.setItem('autoMode', e.target.value));

        // Agent ID
        const userId = window.location.pathname.split('/').filter(p => p)[0] || "User";
        agentLabel.innerText = "Agent: " + userId;

        overlay.addEventListener('pointerdown', (e) => { e.preventDefault(); overlay.style.display = 'none'; }, { once: true });

        function triggerZoom() {
            if (formattedIntl) window.location.href = "zoomphonecall://+" + formattedIntl.replace(/\D/g, '');
        }

        async function fetchLead() {
            pullBtn.disabled = true;
            try {
                const response = await fetch(`/get-number/${userId}`);
                const data = await response.json();
                if (data.phone && data.phone !== currentNum) {
                    currentNum = data.phone;
                    formattedIntl = data.phone.startsWith('00') ? data.phone : '002' + data.phone.replace(/\D/g, '');
                    
                    dialBtn.innerText = data.phone; 
                    dialBtn.href = "tel:" + formattedIntl;
                    copyBtn.innerText = `📋 Copy (${formattedIntl})`;
                    zoomBtn.style.display = 'block';
                    copyBtn.style.display = 'block';
                    
                    if (modeSelect.value === 'zoom') triggerZoom();
                    else if (modeSelect.value === 'phone') window.location.href = "tel:" + formattedIntl;
                }
            } catch (e) { pullBtn.innerText = "Error! ⚠️"; } finally { pullBtn.disabled = false; }
        }
        
        zoomBtn.onclick = triggerZoom;
        copyBtn.onclick = () => navigator.clipboard.writeText(formattedIntl).then(() => {
            const old = copyBtn.innerText;
            copyBtn.innerText = "✅ Copied!";
            setTimeout(() => copyBtn.innerText = old, 2000);
        });
        pullBtn.onclick = fetchLead;
    </script>
</body>
</html>
