<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CRM Dialer - Agent Portal</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: #000; color: #fff; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: space-between; height: 100vh; margin: 0; 
            padding: 20px 0 40px 0; transition: background-color 0.2s;
            overflow: hidden;
        }
        .info { font-size: 14px; color: #666; text-transform: uppercase; letter-spacing: 2px; text-align: center; margin-top: 10px; }
        .button-container { width: 85%; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        
        /* NEW PULL BUTTON STYLE */
        #pull-btn {
            width: 100%; height: 12vh; background: #3498db; color: white;
            border: none; border-radius: 20px; font-size: 22px; font-weight: 800;
            cursor: pointer; box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
            -webkit-tap-highlight-color: transparent;
        }
        #pull-btn:active { transform: scale(0.95); background: #2980b9; }

        #dial-btn {
            width: 100%; height: 40vh; display: flex; 
            align-items: center; justify-content: center;
            background: #2ecc71; color: white; text-decoration: none; 
            font-size: 32px; font-weight: 800; border-radius: 30px; 
            text-align: center; border: 4px solid rgba(255,255,255,0.1);
            -webkit-tap-highlight-color: transparent;
        }
        #copy-btn {
            width: 100%; height: 8vh; display: none; 
            align-items: center; justify-content: center;
            background: #333; color: #fff; text-decoration: none;
            font-size: 18px; font-weight: 600; border-radius: 20px;
            border: 1px solid #444;
        }
        .footer { color: #444; font-size: 12px; text-align: center; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 100;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: #2ecc71; text-align: center; cursor: pointer; padding: 20px;
        }
    </style>
</head>
<body>

    <div id="overlay">TAP TO START AGENT SESSION</div>

    <div class="info" id="agent-label">Agent: Loading...</div>
    
    <div class="button-container">
        <button id="pull-btn">📥 PULL NEW LEAD</button>
        <a id="dial-btn" href="javascript:void(0)">No Number</a>
        <button id="copy-btn">📋 Copy Number</button>
    </div>
    
    <div class="footer" id="last-sync">Ready to pull.</div>

    <script>
        const btn = document.getElementById('dial-btn');
        const copyBtn = document.getElementById('copy-btn');
        const pullBtn = document.getElementById('pull-btn');
        const sync = document.getElementById('last-sync');
        const overlay = document.getElementById('overlay');
        const agentLabel = document.getElementById('agent-label');

        let currentNum = "";
        let formattedIntl = "";
        let vibrationUnlocked = false;

        // 1. Get Agent ID from the URL path (/john -> john)
        const pathParts = window.location.pathname.split('/');
        let userId = pathParts[pathParts.length - 1].toLowerCase();

        if (!userId || userId === "" || userId === "index.html") {
            userId = prompt("Enter your name (e.g., john, hany, monem):");
            if (userId) window.location.href = "/" + userId;
        }
        
        agentLabel.innerText = "Agent: " + userId;

        // Unlock audio/vibration
        window.addEventListener('click', () => {
            if (!vibrationUnlocked) {
                vibrationUnlocked = true;
                overlay.style.display = 'none';
                if (navigator.vibrate) navigator.vibrate(100);
            }
        }, { once: true });

        function formatInternational(num) {
            let clean = num.replace(/\D/g, ''); 
            if (!clean.startsWith('002')) {
                clean = clean.startsWith('2') ? '00' + clean : '002' + clean;
            }
            return clean;
        }

        // 2. Manual Pull Logic
        async function fetchLead() {
            if (!userId) return;
            
            pullBtn.innerText = "Searching... 🔍";
            pullBtn.disabled = true;

            try {
                const response = await fetch(`/get-number/${userId}`);
                const data = await response.json();

                if (data.phone && data.phone !== "No number yet") {
                    currentNum = data.phone;
                    formattedIntl = formatInternational(data.phone);
                    
                    btn.innerText = data.phone; 
                    btn.href = "tel:" + formattedIntl;
                    copyBtn.style.display = 'flex';
                    
                    // Alert agent
                    document.body.style.backgroundColor = "#2ecc71";
                    setTimeout(() => { document.body.style.backgroundColor = "#000"; }, 400);
                    if (vibrationUnlocked && navigator.vibrate) navigator.vibrate([500, 100, 500]);
                    
                    sync.innerText = "Lead Received: " + new Date().toLocaleTimeString();
                    pullBtn.innerText = "📥 PULL NEW LEAD";
                } else {
                    pullBtn.innerText = "No New Leads ❌";
                    setTimeout(() => { pullBtn.innerText = "📥 PULL NEW LEAD"; }, 2000);
                }
            } catch (e) {
                console.error("Poll error:", e);
                pullBtn.innerText = "Error! ⚠️";
            } finally {
                pullBtn.disabled = false;
            }
        }

        // Copy Function
        copyBtn.onclick = () => {
            navigator.clipboard.writeText(formattedIntl).then(() => {
                const oldText = copyBtn.innerText;
                copyBtn.innerText = "COPIED! ✅";
                setTimeout(() => copyBtn.innerText = oldText, 1500);
            });
        };

        pullBtn.onclick = fetchLead;
    </script>
</body>
</html>
